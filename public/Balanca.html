<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balança e Impressoras</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/Balanca.css">
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap');

        :root {
            --primary: #5b21b6;
            --primary-light: #7c3aed;
            --primary-pale: #ede9fe;
            --accent: #f59e0b;
            --success: #059669;
            --danger: #dc2626;
            --bg: #f8f7ff;
            --surface: #ffffff;
            --border: #e4e0f5;
            --text: #1e1b4b;
            --muted: #6b7280;
            --radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #5b21b6 0%, #7c3aed 60%, #a78bfa 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 24px rgba(91,33,182,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.35);
            transform: translateX(-2px);
        }

        .header-title {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.25);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-badge {
            background: rgba(255,255,255,0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        /* MAIN */
        .main {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 16px 60px;
        }

        /* HERO CARD */
        .hero-card {
            background: linear-gradient(135deg, #5b21b6, #7c3aed);
            border-radius: 20px;
            padding: 28px 32px;
            color: white;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: '🏗️';
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 72px;
            opacity: 0.15;
        }

        .hero-card h1 {
            font-family: 'Syne', sans-serif;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .hero-card p {
            opacity: 0.85;
            font-size: 14px;
            font-weight: 400;
        }

        /* PROGRESS BAR */
        .progress-wrap {
            background: white;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(91,33,182,0.08);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .progress-text {
            min-width: 60px;
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
        }

        .progress-bar-bg {
            flex: 1;
            height: 10px;
            background: var(--primary-pale);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #5b21b6, #a78bfa);
            border-radius: 20px;
            transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
            width: 0%;
        }

        .progress-label {
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
            min-width: 80px;
            text-align: right;
        }

        /* ALERT */
        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .alert.visible { display: flex; align-items: center; gap: 10px; }
        .alert-success { background: #d1fae5; color: #065f46; border-left: 4px solid #059669; }
        .alert-error { background: #fee2e2; color: #991b1b; border-left: 4px solid #dc2626; }

        /* SECTION DIVIDER */
        .section-divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 32px 0 20px;
        }

        .section-divider-line {
            flex: 1;
            height: 2px;
            background: var(--border);
            border-radius: 2px;
        }

        .section-label {
            background: linear-gradient(135deg, #5b21b6, #7c3aed);
            color: white;
            padding: 7px 18px;
            border-radius: 30px;
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* FORM CARD */
        .form-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 22px 24px;
            margin-bottom: 14px;
            border: 2px solid var(--border);
            transition: all 0.3s;
            position: relative;
        }

        .form-card:hover {
            border-color: #a78bfa;
            box-shadow: 0 4px 20px rgba(91,33,182,0.08);
        }

        .form-card.answered {
            border-color: #a7f3d0;
            background: #f0fdf4;
        }

        .form-card label.main-label {
            display: block;
            font-weight: 600;
            font-size: 15px;
            color: var(--text);
            margin-bottom: 14px;
            line-height: 1.5;
        }

        /* TEXT INPUT */
        .form-card input[type="text"],
        .form-card input[type="date"],
        .form-card input[type="time"],
        .form-card input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: var(--text);
            background: var(--bg);
            transition: all 0.3s;
            outline: none;
        }

        .form-card input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(124,58,237,0.1);
            background: white;
        }

        /* RADIO GROUP */
        .radio-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .radio-option {
            flex: 1;
            min-width: 100px;
        }

        .radio-option input[type="radio"] {
            display: none;
        }

        .radio-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.25s;
            color: var(--muted);
            background: var(--bg);
            user-select: none;
        }

        .radio-option input[type="radio"]:checked + label {
            border-color: var(--primary);
            background: var(--primary-pale);
            color: var(--primary);
        }

        .radio-option.sim input[type="radio"]:checked + label {
            border-color: #dc2626;
            background: #fef2f2;
            color: #dc2626;
        }

        .radio-option.nao input[type="radio"]:checked + label {
            border-color: #059669;
            background: #f0fdf4;
            color: #059669;
        }

        .radio-option label:hover {
            border-color: var(--primary-light);
            background: var(--primary-pale);
            color: var(--primary-light);
        }

        /* TURNO SPECIFIC */
        .turno-group {
            display: flex;
            gap: 10px;
        }

        .turno-option {
            flex: 1;
        }

        .turno-option input[type="radio"] { display: none; }

        .turno-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 10px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 22px;
            color: var(--muted);
            background: var(--bg);
            transition: all 0.25s;
            user-select: none;
        }

        .turno-option label span {
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 500;
            margin-top: 4px;
            opacity: 0.7;
        }

        .turno-option input[type="radio"]:checked + label {
            border-color: var(--primary);
            background: var(--primary-pale);
            color: var(--primary);
        }

        /* SUBMIT AREA */
        .submit-area {
            margin-top: 36px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #5b21b6, #7c3aed);
            color: white;
            border: none;
            border-radius: 14px;
            font-family: 'Syne', sans-serif;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 24px rgba(91,33,182,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(91,33,182,0.45);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-clear {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--muted);
            border: 2px solid var(--border);
            border-radius: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-clear:hover {
            border-color: #dc2626;
            color: #dc2626;
            background: #fef2f2;
        }

        /* HISTORY */
        .history-section {
            margin-top: 48px;
        }

        .history-section h2 {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-card {
            background: white;
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .history-card:hover {
            border-color: #a78bfa;
            box-shadow: 0 4px 16px rgba(91,33,182,0.1);
            transform: translateX(4px);
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .history-operator {
            font-weight: 700;
            font-size: 15px;
            color: var(--text);
        }

        .history-date {
            font-size: 13px;
            color: var(--muted);
        }

        .history-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .meta-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: var(--primary-pale);
            color: var(--primary);
        }

        .meta-tag.danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .meta-tag.success {
            background: #d1fae5;
            color: #065f46;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(30, 27, 75, 0.6);
            backdrop-filter: blur(6px);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-box {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(91,33,182,0.25);
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }

        .modal-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .modal-close {
            background: #f3f4f6;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            color: var(--muted);
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: #fee2e2;
            color: #dc2626;
            transform: rotate(90deg);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 14px;
        }

        .detail-row:last-child { border-bottom: none; }

        .detail-label {
            color: var(--muted);
            font-weight: 500;
            flex: 1;
        }

        .detail-value {
            font-weight: 600;
            color: var(--text);
        }

        .badge-sim {
            background: #fef2f2;
            color: #dc2626;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
        }

        .badge-nao {
            background: #f0fdf4;
            color: #059669;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
        }

        /* LOADING */
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--primary-pale);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            text-align: center;
            color: var(--muted);
            padding: 40px;
            font-size: 15px;
        }

        /* EMPTY */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--muted);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .hero-card h1 { font-size: 20px; }
            .hero-card::before { display: none; }
            .radio-group { flex-direction: column; }
            .radio-option { min-width: 100%; }
            .main { padding: 24px 12px 60px; }
        }

        /* AUTOFILL detected style */
        .check-icon {
            position: absolute;
            top: 18px;
            right: 18px;
            color: #059669;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .form-card.answered .check-icon { opacity: 1; }
    
</style>

<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <a href="menu.html" class="back-btn">← Voltar</a>
        <div class="header-title">
        </div>
    </div>
    <div class="user-info">
        <span class="user-badge" id="userBadge">Operador</span>

</div>

<!-- MAIN -->
<div class="main">

    <!-- HERO -->
    <div class="hero-card">
        <h1>Balanças e Impressoras</h1>

    </div>

    <!-- PROGRESS -->
    <div class="progress-wrap">
        <div class="progress-text" id="progressPercent">0%</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="progress-label" id="progressLabel">0 / 0 campos</div>
    </div>

    <!-- ALERT -->
    <div class="alert" id="alertBox"></div>

        <!-- INSPEÇÃO VISUAL GERAL -->

            <div class="section-label">Alguma balança Divergente?</div>

        </div>
  
  <!-- Cadastro de balanças-->

        <div class="form-card" id="card_q2">

        <div class="form-card" id="card_q4">

                </div>
                <div class="radio-option nao">
                    <input type="radio" name="q5" id="q5_nao" value="Não">

        <div class="form-card" id="card_q6">

        <div class="form-card" id="card_q8">
            <span class="check-icon">✓</span>
            <label class="main-label">Impressora Rua 53</label>
            <div class="radio-group">
                <div class="radio-option nao">
                    <input type="radio" name="q8" id="q8_sim" value="Sim">
                    <label for="q8_sim">✅ Sim</label>

<script>

  
const PERGUNTAS = {

    q4:  'Balança Rua 17',
    q5:  'Balança Rua 13',
    q6:  'Balança Rua 07',
    q7:  'Impressora Rua 34',
    q8:  'Impressora Rua 53',
    q9:  'Impressora Rua 54',
    q10: 'Impressora Rua 21',

    q12: 'Impressora Rua 13',
    q14: 'Impressora Rua 07',
    q15: 'Impressora REC Mesa',
    q16: 'Impressora REC Doca 2',
    q17: 'Impressora REC Doca 8',
    q18: 'Impressora REC Doca 12',
    q19: 'Impressora REC Doca 15',
    q20: 'Impressora REC Doca 19',
    q21: 'Impressora REC Doca 22',
  
};

const ALERTA_NAO = ['q1','q3','q4','q5','q2','q6','q7','q8','q9','q10','q11','q12','q14','q15','q16','q17','q18'];

function isProblema(key, value) {
    if (ALERTA_NAO.includes(key) && value === 'Não') return true;
    return false;



// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
    if (typeof window.supabase !== 'undefined') {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    const saved = localStorage.getItem('currentUser');
    if (saved) {
        currentUser = JSON.parse(saved);
        document.getElementById('userBadge').textContent = currentUser.nome || 'Operador';
        document.getElementById('operador').value = currentUser.nome || '';
        atualizarCard('operador', document.getElementById('operador'));
        window.notifInit?.();
        window.pushInit?.();
    } else {
        window.location.href = 'login.html';
        return;
    }

    const now = new Date();
    document.getElementById('data').value = now.toISOString().split('T')[0];
    document.getElementById('hora').value = now.toTimeString().slice(0,5);
    atualizarCard('data', document.getElementById('data'));
    atualizarCard('hora', document.getElementById('hora'));

    setupListeners();
    atualizarProgresso();
    carregarHistorico();
});

// ── LISTENERS ──
function setupListeners() {
    const form = document.getElementById('checklistForm');

    form.querySelectorAll('input[type="text"], input[type="date"], input[type="time"], input[type="number"]').forEach(input => {
        input.addEventListener('input', () => {
            atualizarCard(input.name || input.id, input);
            atualizarProgresso();
        });
    });

    form.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', () => {
            atualizarCard(radio.name, radio);
            atualizarProgresso();
        });
    });

    form.querySelectorAll('input[name="turno"]').forEach(r => {
        r.addEventListener('change', () => {
            atualizarCard('turno', r);
            atualizarProgresso();
        });
    });

    form.addEventListener('submit', enviarChecklist);
}

function atualizarCard(fieldName, el) {
    const cardId = 'card_' + fieldName;
    const card = document.getElementById(cardId);
    if (!card) return;
    const filled = el.value && el.value.trim() !== '';
    card.classList.toggle('answered', filled);
}

// ── PROGRESS ──
// Agora são 25 campos: 7 identificação + 18 perguntas
function atualizarProgresso() {
    const form = document.getElementById('checklistForm');
    const totalCampos = 25;
    let preenchidos = 0;

    ['operador','matricula','numero_maquina','horimetro','data','hora'].forEach(id => {
        const el = document.getElementById(id);
        if (el && el.value.trim()) preenchidos++;
    });

    if (form.querySelector('input[name="turno"]:checked')) preenchidos++;

    for (let i = 1; i <= 18; i++) {
        if (form.querySelector(`input[name="q${i}"]:checked`)) preenchidos++;
    }

    const pct = Math.round((preenchidos / totalCampos) * 100);
    document.getElementById('progressPercent').textContent = pct + '%';
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = `${preenchidos} / ${totalCampos} campos`;
}

// ── SUBMIT ──
async function enviarChecklist(e) {
    e.preventDefault();

    const form = document.getElementById('checklistForm');
    const btn  = document.getElementById('btnSubmit');

    let missing = [];
    for (let i = 1; i <= 18; i++) {
        if (!form.querySelector(`input[name="q${i}"]:checked`)) {
            missing.push(i);
        }
    }
    if (!form.querySelector('input[name="turno"]:checked')) {
        mostrarAlerta('Por favor, selecione o turno.', 'error');
        return;
    }
    if (missing.length > 0) {
        mostrarAlerta(`Por favor, responda todas as perguntas. Faltam ${missing.length} resposta(s).`, 'error');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span style="animation:spin 0.8s linear infinite;display:inline-block">⏳</span> Enviando...';

    const respostas = {};
    for (let i = 1; i <= 18; i++) {
        respostas[`q${i}`] = form.querySelector(`input[name="q${i}"]:checked`)?.value || '';
    }

    const payload = {
        operador:       document.getElementById('operador').value.trim(),
        matricula:      document.getElementById('matricula').value.trim(),
        numero_maquina: document.getElementById('numero_maquina').value.trim(),
        turno:          form.querySelector('input[name="turno"]:checked')?.value || '',
        horimetro:      document.getElementById('horimetro').value,
        data:           document.getElementById('data').value,
        hora:           document.getElementById('hora').value,
        usuario_id:     currentUser?.id || null,
        respostas:      respostas
    };

    payload.total_problemas = Object.entries(respostas).filter(([k, v]) => isProblema(k, v)).length;

    try {
        if (db) {
            const { error } = await db.from('checklist_diario').insert([payload]);
            if (error) throw error;
        } else {
            const existing = JSON.parse(localStorage.getItem('checklists') || '[]');
            existing.unshift({ ...payload, id: Date.now(), created_at: new Date().toISOString() });
            localStorage.setItem('checklists', JSON.stringify(existing.slice(0, 50)));
        }

        mostrarAlerta('✅ Check-list enviado com sucesso!', 'success');

        // Notificação automática
        if (payload.total_problemas > 0) {
            await notificar('checklist_problema',
                `⚠️ Check-list com ${payload.total_problemas} problema(s)`,
                `Operador: ${payload.operador} | Máquina: ${payload.numero_maquina} | Turno: ${payload.turno}.`,
                'checklist-painel.html');
        } else {
            await notificar('checklist_problema',
                `✅ Check-list enviado`,
                `Operador: ${payload.operador} | Máquina: ${payload.numero_maquina} | Sem problemas.`,
                'checklist-painel.html');
        }

        form.reset();

        document.getElementById('operador').value = currentUser?.nome || '';
        const now = new Date();
        document.getElementById('data').value = now.toISOString().split('T')[0];
        document.getElementById('hora').value = now.toTimeString().slice(0,5);

        document.querySelectorAll('.form-card.answered').forEach(c => c.classList.remove('answered'));
        atualizarProgresso();
        carregarHistorico();

    } catch (err) {
        console.error(err);
        mostrarAlerta('Erro ao enviar check-list: ' + (err.message || err), 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>📋</span> Enviar Check-list';
    }
}

// ── HISTÓRICO ──
async function carregarHistorico() {
    const lista = document.getElementById('historicoLista');
    lista.innerHTML = '<div class="spinner"></div>';

    try {
        let data = [];

        if (db) {
            const res = await db
                .from('checklist_diario')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(30);
            if (res.error) throw res.error;
            data = res.data || [];
        } else {
            data = JSON.parse(localStorage.getItem('checklists') || '[]');
        }

        if (!data.length) {
            lista.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>Nenhum check-list registrado ainda.</p></div>';
            return;
        }

        lista.innerHTML = data.map(item => {
            const dt = new Date(item.created_at || item.data).toLocaleString('pt-BR');
            const prob = item.total_problemas || 0;
            const maquina = item.numero_maquina ? `<span class="meta-tag">🏭 Máq. ${item.numero_maquina}</span>` : '';
            return `
                <div class="history-card" onclick="verDetalhes(${JSON.stringify(JSON.stringify(item))})">
                    <div class="history-top">
                        <div class="history-operator">👤 ${item.operador}</div>
                        <div class="history-date">${dt}</div>
                    </div>
                    <div class="history-meta">
                        <span class="meta-tag">Turno ${item.turno}</span>
                        ${maquina}
                        <span class="meta-tag">Horímetro: ${item.horimetro}</span>
                        ${prob > 0
                            ? `<span class="meta-tag danger">⚠️ ${prob} problema(s)</span>`
                            : `<span class="meta-tag success">✅ Sem problemas</span>`}
                    </div>
                </div>
            `;
        }).join('');

    } catch (err) {
        console.error(err);
        lista.innerHTML = '<div class="loading-text">Erro ao carregar histórico.</div>';
    }
}

// ── DETALHES MODAL ──
function verDetalhes(jsonStr) {
    const item = JSON.parse(jsonStr);
    const dt = new Date(item.created_at || item.data).toLocaleString('pt-BR');

    let html = `
        <div class="detail-row"><span class="detail-label">Operador</span><span class="detail-value">${item.operador}</span></div>
        <div class="detail-row"><span class="detail-label">Matrícula</span><span class="detail-value">${item.matricula}</span></div>
        <div class="detail-row"><span class="detail-label">Nº da Máquina</span><span class="detail-value">${item.numero_maquina || '–'}</span></div>
        <div class="detail-row"><span class="detail-label">Turno</span><span class="detail-value">${item.turno}</span></div>
        <div class="detail-row"><span class="detail-label">Horímetro</span><span class="detail-value">${item.horimetro}</span></div>
        <div class="detail-row"><span class="detail-label">Data</span><span class="detail-value">${item.data}</span></div>
        <div class="detail-row"><span class="detail-label">Hora</span><span class="detail-value">${item.hora}</span></div>
        <div class="detail-row"><span class="detail-label">Enviado em</span><span class="detail-value">${dt}</span></div>
    `;

    if (item.respostas) {
        html += `<hr style="margin:20px 0;border:none;border-top:2px solid #f3f4f6;">`;
        html += `<h3 style="font-family:'Syne',sans-serif;font-size:16px;margin-bottom:14px;color:#1e1b4b;">Respostas das inspeções</h3>`;
        Object.entries(item.respostas).forEach(([key, val]) => {
            const label = PERGUNTAS[key] || key;
            const problema = isProblema(key, val);
            const badgeClass = val === 'Sim' ? 'badge-sim' : 'badge-nao';
            html += `
                <div class="detail-row" style="${problema ? 'background:#fff5f5;border-radius:8px;padding:10px 12px;margin-bottom:4px;' : ''}">
                    <span class="detail-label" style="font-size:13px;">${label}</span>
                    <span class="${badgeClass}">${val}</span>
                </div>
            `;
        });
    }

    document.getElementById('modalConteudo').innerHTML = html;
    document.getElementById('modalDetalhes').classList.add('active');
}

function fecharModal() {
    document.getElementById('modalDetalhes').classList.remove('active');
}

document.getElementById('modalDetalhes').addEventListener('click', e => {
    if (e.target === document.getElementById('modalDetalhes')) fecharModal();
});

// ── ALERT ──
function mostrarAlerta(msg, tipo) {
    const box = document.getElementById('alertBox');
    box.className = `alert ${tipo === 'success' ? 'alert-success' : 'alert-error'} visible`;
    box.innerHTML = (tipo === 'success' ? '✅ ' : '⚠️ ') + msg;
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => { box.classList.remove('visible'); }, 6000);
}

// ── CLEAR ──
function limparFormulario() {
    if (!confirm('Limpar todos os campos?')) return;
    document.getElementById('checklistForm').reset();
    document.getElementById('operador').value = currentUser?.nome || '';
    const now = new Date();
    document.getElementById('data').value = now.toISOString().split('T')[0];
    document.getElementById('hora').value = now.toTimeString().slice(0, 5);
    document.querySelectorAll('.form-card.answered').forEach(c => c.classList.remove('answered'));
    atualizarProgresso();
}
